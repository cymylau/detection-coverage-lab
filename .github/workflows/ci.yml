name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Syntax and docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in run-everything.sh lock-down-network.sh playbooks/*.sh services/*.sh; do
            bash -n "$f" || exit 1
          done
      - name: Python compiles
        run: python3 -m py_compile services/*.py playbooks/*.py tests/*.py
      - name: Compose files are valid
        run: docker compose -f compose.yml -f compose.privileged.yml config -q
      - name: Unit tests (reporting, scoring, confirmation, selection)
        run: python3 -m unittest discover -s tests -v
      - name: Docs match the code
        run: python3 tests/check-docs.py
      - name: ShellCheck (errors block)
        run: shellcheck -S error run-everything.sh lock-down-network.sh playbooks/*.sh services/*.sh
      - name: ShellCheck (warnings, informational)
        # The remaining warnings are mostly variables used by the scripts that
        # source lib-stealth.sh; shown for review, not blocking.
        continue-on-error: true
        run: shellcheck -S warning run-everything.sh lock-down-network.sh playbooks/*.sh services/*.sh

  smoke:
    name: Smoke run (OWASP scenarios)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: bash run-everything.sh --check
      - name: Run the OWASP scenarios
        run: bash run-everything.sh --only owasp
      - name: Check the results
        run: |
          python3 - <<'PY'
          import json
          cats = {json.loads(l)["category"] for l in open("results/webapp_events.jsonl")}
          missing = {f"A{n:02d}" for n in range(1, 11)} - cats
          assert not missing, f"no web-app events for {sorted(missing)}"
          rows = [json.loads(l) for l in open("results/activity_confirmed.jsonl")]
          not_seen = [r for r in rows if r.get("observed") == "NO"]
          assert rows, "empty activity log"
          assert not not_seen, f"{len(not_seen)} action(s) never reached their destination"
          print(f"{len(rows)} actions, all OWASP categories exercised, every remote action confirmed")
          PY
          test -s results/activity_report.txt
          python3 -c 'import json,sys; r=json.load(open("results/last_run.json")); print(r); sys.exit(r["status"] != "ok")'
      - name: Re-run one technique on the same lab (no teardown in between)
        # Exercises --technique selection, re-using a locked-down lab, the
        # readiness wait, and the egress check in lock-down-network.sh.
        run: bash run-everything.sh --technique T1552.005
      - name: Check the re-run
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open("results/last_run.json"))
          assert r["status"] == "ok" and r["stages"], r
          rows = [json.loads(l) for l in open("results/activity_confirmed.jsonl")]
          techs = {x["technique"] for x in rows}
          assert "T1552.005" in techs, techs
          assert not [x for x in rows if x.get("observed") == "NO"], "an action never reached its destination"
          print(f"re-run ok: {len(rows)} actions, stages: {[s['name'] for s in r['stages']]}")
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: bash run-everything.sh --down
