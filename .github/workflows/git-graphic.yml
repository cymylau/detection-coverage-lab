name: Git history graphic

# On every push to main, draw the last 30 days of commit history with
# pretty-git-tree (https://github.com/hmillerbakewell/pretty-git-tree) and
# publish the images to the git-graphic branch, which the README embeds.
#
# git-graphic is an orphan branch holding one commit, force-pushed each run,
# so images never pile up in main's history. Pushes made with GITHUB_TOKEN do
# not trigger workflows, so this cannot loop.
#
# Only the commit graph's shape leaves git: ids, times, parents and HEAD. No
# names, authors, messages or file contents.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: git-graphic
  cancel-in-progress: true

env:
  DAYS: "30"
  OUT_BRANCH: git-graphic
  NAME: detection-coverage-lab
  # pretty-git-tree is third-party code: pinned to a reviewed commit. Bump deliberately.
  PGT_REPO: hmillerbakewell/pretty-git-tree
  PGT_SHA: 95c4aa076711aee37aa1ce10e325183e3c509aff

jobs:
  render:
    name: Render and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # every branch, full history

      - name: Export the commit shape
        id: shape
        run: |
          since=$(date -u -d "${DAYS} days ago" +%Y-%m-%dT00:00)
          until=$(date -u +%Y-%m-%dT23:59:59)
          # --all, minus the output branch itself
          git log --exclude="refs/remotes/origin/${OUT_BRANCH}" --all --no-color \
            --decorate-refs=HEAD --since="$since" --until="$until" \
            '--format=%H %ct %P%d' > "$RUNNER_TEMP/git-shape.txt"
          n=$(wc -l < "$RUNNER_TEMP/git-shape.txt")
          echo "commits=$n since=$since until=$until"
          [ "$n" -gt 0 ] || { echo "::error::no commits in the last ${DAYS} days"; exit 1; }
          { echo "since=${since%T*}"; echo "until=${until%T*}"; echo "commits=$n"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PGT_REPO }}
          ref: ${{ env.PGT_SHA }}
          path: .pgt
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pretty-git-tree (lockfile, no install scripts)
        working-directory: .pgt
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Render
        run: |
          cp .github/scripts/render-git-shape.ts .pgt/scripts/
          out="$RUNNER_TEMP/out"
          (cd .pgt && node scripts/render-git-shape.ts "$RUNNER_TEMP/git-shape.txt" "$out" "$NAME")
          cp "$RUNNER_TEMP/git-shape.txt" "$out/"
          ls -l "$out"

      - name: Publish to the ${{ env.OUT_BRANCH }} branch
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.shape.outputs.since }}
          UNTIL: ${{ steps.shape.outputs.until }}
          COMMITS: ${{ steps.shape.outputs.commits }}
        run: |
          cd "$RUNNER_TEMP/out"
          cat > README.md <<EOF
          # Git history graphic

          Generated by \`.github/workflows/git-graphic.yml\` on \`main\`; do not edit.
          Every push to main replaces this branch.

          - Range: ${SINCE} to ${UNTIL} (UTC), ${COMMITS} commits, all branches
          - Source commit: ${GITHUB_SHA}
          - Renderer: [${PGT_REPO}](https://github.com/${PGT_REPO}) at ${PGT_SHA::7}
          - Input: \`git-shape.txt\` (ids, times, parents and HEAD only)
          EOF
          git init -q -b "$OUT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Git history graphic: ${SINCE} to ${UNTIL} at ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${OUT_BRANCH}"
          echo "published ${COMMITS} commits (${SINCE} to ${UNTIL}) to ${OUT_BRANCH}"
