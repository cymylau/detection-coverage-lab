services:
  # Attacker workstation — runs the emulation chain (nmap -> IMDS -> base64 -> DNS exfil).
  edr-tester:
    image: kalilinux/kali-rolling
    container_name: edr-test-lab
    hostname: attacker-workstation
    # NET_ADMIN lets lab-setup.sh alias 169.254.169.254 onto loopback.
    # (Full privileged mode is not required for this scenario.)
    cap_add:
      - NET_ADMIN
    command: ["sleep", "infinity"]
    volumes:
      - ./test-scripts:/home/root/test-scripts
      - ./services:/home/root/services
      - ./results:/home/root/results
    working_dir: /home/root
    environment:
      - TZ=UTC
      - DEBIAN_FRONTEND=noninteractive
      - METADATA_IP=169.254.169.254
      - EXFIL_DOMAIN=exfil.lab
      - DNS_SINK=dns-sink
      - RESULTS_DIR=/home/root/results
      - SERVICES_DIR=/home/root/services
      - DECOY_DIR=/home/root/decoy-data
      - C2_HOST=mock-c2
      - C2_PORT=8443
      - INTERNAL_HOST=internal-host
      - INTERNAL_HOST_USER=decoyuser
      - INTERNAL_HOST_PASS=LAB-DECOY-NOT-REAL-PASSWORD
    networks:
      - labnet
    depends_on:
      - dns-sink
      - mock-c2
      - internal-host
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # Local DNS sink — the "attacker-controlled nameserver" that receives exfil.
  # Logs every query and reassembles the decoded payload into ./results.
  dns-sink:
    image: python:3.12-slim
    container_name: edr-lab-dns-sink
    hostname: dns-sink
    command: ["python3", "/app/dns_sink.py"]
    volumes:
      - ./services:/app:ro
      - ./results:/home/root/results
    environment:
      - DNS_BIND=0.0.0.0
      - DNS_PORT=53
      - EXFIL_DOMAIN=exfil.lab
      - RESULTS_DIR=/home/root/results
    networks:
      - labnet

  # Mock C2 server — attacker-controlled HTTP endpoint for beacon/exfil
  # scenarios (simulate-c2-beacon.sh, simulate-https-exfil.sh). Only ever
  # hands out one hardcoded, harmless no-op "task". Lab-internal only.
  mock-c2:
    image: python:3.12-slim
    container_name: edr-lab-mock-c2
    hostname: mock-c2
    command: ["python3", "/app/mock_c2.py"]
    volumes:
      - ./services:/app:ro
      - ./results:/home/root/results
    environment:
      - C2_BIND=0.0.0.0
      - C2_PORT=8443
      - RESULTS_DIR=/home/root/results
    networks:
      - labnet

  # Internal "second host" — target for lateral-movement and SSH-audit-
  # session emulation (simulate-lateral-movement.sh,
  # simulate-ssh-audit-session.sh). Decoy account only, no real data,
  # reachable only on the lab's internal bridge network. SUDO_ACCESS gives
  # the decoy account passwordless sudo so the audit-session scenario has
  # something real to show for `sudo -l` / `sudo cat /etc/shadow`, not
  # just permission-denied noise.
  internal-host:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: edr-lab-internal-host
    hostname: internal-host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=decoyuser
      - USER_PASSWORD=LAB-DECOY-NOT-REAL-PASSWORD
      - SUDO_ACCESS=true
    networks:
      - labnet

networks:
  labnet:
    driver: bridge
    # Default bridge keeps egress so apt can install tooling in the Kali box.
    # Safety does not depend on network isolation: the credentials are decoys
    # and the DNS exfil is addressed to the in-lab `dns-sink` by hostname, so
    # no real data is staged and nothing is sent to an external resolver.
    # To harden further, set `internal: true` AFTER tools are installed.
