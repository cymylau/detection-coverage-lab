services:
  # Attacker workstation — runs the emulation chain (nmap -> IMDS -> base64 -> DNS exfil).
  ops-console:
    image: kalilinux/kali-rolling@sha256:7997e0581c4f5c185cfe6773d5cae8fcc7c6b79798726ccaabf843af4bcd2013
    container_name: northline-ops-console
    hostname: attacker-workstation
    # NET_ADMIN lets bootstrap.sh alias 169.254.169.254 onto loopback.
    # (Full privileged mode is not required for this scenario.)
    cap_add:
      - NET_ADMIN
    command: ["sleep", "infinity"]
    volumes:
      # Read-only: control-api and dns-sink execute these same files as root,
      # so a compromised ops-console must not be able to rewrite them.
      - ./playbooks:/home/root/playbooks:ro
      - ./services:/home/root/services:ro
      - ./results:/home/root/results
    working_dir: /home/root
    environment:
      - TZ=UTC
      - DEBIAN_FRONTEND=noninteractive
      # Playbooks that touch ~/.ssh, ~/.aws, ~/.bashrc, crontab etc. refuse to
      # run unless this is set (see playbooks/lib-guard.sh).
      - LAB_CONTAINER=1
      # Stealth profile for the scenarios: noisy (default) | careful | quiet | covert.
      # See README "Stealth profiles". Set on the host, e.g. STEALTH=quiet docker compose up -d
      - STEALTH=${STEALTH:-noisy}
      - STEALTH_TIME_SCALE=${STEALTH_TIME_SCALE:-1}
      - STEALTH_TIMING=${STEALTH_TIMING:-}
      - STEALTH_TOOLING=${STEALTH_TOOLING:-}
      - STEALTH_ARTIFACTS=${STEALTH_ARTIFACTS:-}
      - METADATA_IP=169.254.169.254
      - EXFIL_DOMAIN=exfil.internal
      - DNS_SINK=dns-sink
      - RESULTS_DIR=/home/root/results
      - SERVICES_DIR=/home/root/services
      - DECOY_DIR=/home/root/decoy-data
      - C2_HOST=control-api
      - C2_PORT=8443
      - INTERNAL_HOST=internal-host
      - INTERNAL_HOST_USER=decoyuser
      - INTERNAL_HOST_PASS=DECOY-NOT-REAL-PASSWORD
      - WEB_HOST=web-portal
      - WEB_PORT=8080
    networks:
      - northline-net
      - setup-net   # egress for tool install only; removed by lock-down-network.sh
    depends_on:
      - dns-sink
      - control-api
      - internal-host
      - web-portal
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # Local DNS sink — the "attacker-controlled nameserver" that receives exfil.
  # Logs every query and reassembles the decoded payload into ./results.
  dns-sink:
    image: python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54
    container_name: northline-dns-sink
    hostname: dns-sink
    command: ["python3", "/app/dns_sink.py"]
    volumes:
      - ./services:/app:ro
      - ./results:/home/root/results
    environment:
      - DNS_BIND=0.0.0.0
      - DNS_PORT=53
      - EXFIL_DOMAIN=exfil.internal
      - RESULTS_DIR=/home/root/results
    networks:
      - northline-net

  # Command-and-control relay — attacker-controlled HTTP endpoint for beacon/exfil
  # scenarios (run-c2-beacon.sh, run-https-exfil.sh). Only ever
  # hands out one hardcoded, harmless no-op "task". Internal to this environment only.
  control-api:
    image: python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54
    container_name: northline-control-api
    hostname: control-api
    command: ["python3", "/app/control_api.py"]
    volumes:
      - ./services:/app:ro
      - ./results:/home/root/results
    environment:
      - C2_BIND=0.0.0.0
      - C2_PORT=8443
      - RESULTS_DIR=/home/root/results
    networks:
      - northline-net

  # Deliberately vulnerable DECOY web app for the OWASP Top 10:2025 scenarios
  # (run-owasp-top10.sh). Real vulnerable code paths, inert DECOY payloads,
  # decoy data only. Internal network only (no published ports, no egress:
  # it is never attached to setup-net). NET_ADMIN is used once at start to
  # alias the decoy metadata IP onto loopback for the SSRF scenario.
  web-portal:
    image: python:3.12-alpine@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7
    container_name: northline-web-portal
    hostname: web-portal
    command: ["sh", "/app/webapp-entrypoint.sh"]
    cap_add:
      - NET_ADMIN
    volumes:
      - ./services:/app:ro
      - ./results:/home/root/results
    environment:
      - WEB_BIND=0.0.0.0
      - WEB_PORT=8080
      - RESULTS_DIR=/home/root/results
    networks:
      - northline-net

  # Internal "second host" — target for lateral-movement and SSH-audit-
  # session emulation (run-lateral-movement.sh,
  # run-ssh-audit-session.sh). Decoy account only, no real data,
  # reachable only on the environment's internal bridge network. SUDO_ACCESS gives
  # the decoy account passwordless sudo so the audit-session scenario has
  # something real to show for `sudo -l` / `sudo cat /etc/shadow`, not
  # just permission-denied noise.
  internal-host:
    image: lscr.io/linuxserver/openssh-server:latest@sha256:aa4e1b3916e8555f24e574e6108b0b89a1b20362b0a11800a71280b45999649e
    container_name: northline-internal-host
    hostname: internal-host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=decoyuser
      - USER_PASSWORD=DECOY-NOT-REAL-PASSWORD
      - SUDO_ACCESS=true
    networks:
      - northline-net

networks:
  # All lab traffic. `internal: true` means no gateway: containers cannot reach
  # the internet or the Docker host, only each other.
  northline-net:
    driver: bridge
    internal: true
  # Egress for the setup phase only (apt/docker pull). Only ops-console (and
  # docker-sandbox, in the overlay) attach to it, and lock-down-network.sh
  # (called by run-everything.sh) disconnects them before any scenario runs.
  # If you run scenarios by hand, run `bash lock-down-network.sh` first.
  setup-net:
    driver: bridge
