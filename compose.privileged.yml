# compose.privileged.yml - overlay adding the container-escape scenarios.
#
# Adds a disposable Docker-in-Docker sandbox (docker-sandbox) and points
# edr-tester's Docker client at it via DOCKER_HOST, plus the extra Linux
# capability simulate-privileged-container-abuse.sh uses. Kept as a
# separate file from compose.yml so the base lab stays minimal; add it
# with -f when you want these scenarios too.
#
# docker-sandbox is its own throwaway container: edr-tester never touches
# the real host's /var/run/docker.sock or shares its pid namespace, so
# everything these scenarios do (including "escaping" in
# simulate-docker-socket-escape.sh) stays inside docker-sandbox's own
# filesystem and namespaces.
#
# Usage:
#   docker compose -f compose.yml -f compose.privileged.yml up -d
#   docker compose -f compose.yml -f compose.privileged.yml exec edr-tester \
#       bash test-scripts/install-container-tools.sh
#   docker compose -f compose.yml -f compose.privileged.yml exec edr-tester \
#       bash test-scripts/simulate-docker-socket-escape.sh
#   docker compose -f compose.yml -f compose.privileged.yml down

services:
  edr-tester:
    cap_add:
      - SYS_PTRACE  # for the nsenter/ptrace attempts in simulate-privileged-container-abuse.sh
    environment:
      - DOCKER_HOST=tcp://docker-sandbox:2375
    depends_on:
      - docker-sandbox

  # Disposable nested Docker daemon. privileged:true here is standard for
  # running Docker-in-Docker and is scoped to this throwaway container:
  # it does not touch, and has no path to, the real host Docker daemon or
  # filesystem. Reset by `docker compose down -v` (its storage is ephemeral
  # anyway: no volume is declared for it).
  docker-sandbox:
    image: docker:27-dind
    container_name: edr-lab-docker-sandbox
    hostname: docker-sandbox
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    networks:
      - labnet
